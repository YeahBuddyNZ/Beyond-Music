name: Beyond Music
version: "0.1.0"
slug: beyond_music
description: Your own music, videos and radio on every screen in the house. Beyond™'s media centre.
url: https://github.com/YeahBuddyNZ/Beyond-Music
arch:
  - aarch64
  - amd64
init: false
ingress: true
ingress_port: 8097
ingress_stream: true
panel_icon: mdi:music-circle
panel_title: Music
ports:
  8097/tcp: 8097
ports_description:
  8097/tcp: Music for the TV, phones and other music apps in the house
map:
  - media:ro
  - share:ro
# On the house network itself, so beyond-music.local answers and the TV finds the box.
host_network: true
options:
  folders: []
schema:
  folders:
    - str
