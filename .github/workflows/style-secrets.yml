name: Style and secrets
# The commit hooks only run in a clone that set core.hooksPath. This runs the same two checks on every pull request.
on:
  pull_request:
jobs:
  style-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No keys or signing files in git
        run: bash scripts/check-secrets.sh --all
      - name: No em dashes in added lines
        run: bash scripts/check-style.sh --range "origin/${{ github.base_ref }}"
